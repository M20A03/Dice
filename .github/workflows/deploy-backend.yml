name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'dice_trick.py'
      - 'requirements.txt'
      - 'render.yaml'
      - '.env.example'
      - 'DEPLOY.md'
      - 'DEPLOYMENT_CHECKLIST.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is missing. Add your Render deploy hook URL in GitHub secrets."
            exit 1
          fi

          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"